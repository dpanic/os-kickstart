# rtkit refuses a realtime request unless the client already has a FINITE RLIMIT_RTTIME
# (rtkit-daemon --rttime-usec-max, default 200000us); systemd's default is infinity, so
# without this pipewire and mutter never get a grant. A runaway RT thread also gets
# SIGXCPU then SIGKILL instead of pinning a core.
#
# DefaultLimitRTPRIO is deliberately absent. It used to be 95 here under the claim that
# "mutter/pipewire ask rtkit for RT and give up when RLIMIT_RTPRIO == 0" -- that is false.
# rtkit holds CAP_SYS_NICE and grants SCHED_RR regardless of the client's RLIMIT_RTPRIO,
# and the setting could never apply anyway: the user manager inherits a hard RTPRIO of 0
# from user@.service, and an unprivileged manager cannot raise its own hard limit
# (systemd clamps via setrlimit_closest, which is why `systemctl --user show` reported 95
# while /proc/<gnome-shell>/limits still read 0). Raising it for real, from
# /etc/systemd/system/user@.service.d/, would hand every process in the session SCHED_FIFO
# up to 95 -- above every threaded IRQ handler at FIFO 50 -- and buy nothing.
[Manager]
DefaultLimitRTTIME=200000
