# KICKSTART -- kernel tunings from dpanic/patchfiles
# https://github.com/dpanic/patchfiles
#
# Installed to /etc/sysctl.d/90-kickstart.conf, NOT /etc/sysctl.conf: systemd-sysctl
# only scans the sysctl.d directories, and Ubuntu 26.04 dropped the compat symlink
# that used to make /etc/sysctl.conf work. Sorts after every /usr/lib/sysctl.d file.
#
# No inline trailing comments: sysctl treats everything after '=' as the value, so
# "key = 1  # why" fails with EINVAL.

kernel.sysrq = 0

# Note: fs.file-max is overridden dynamically by autotune.sh based on RAM
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# Memory management tuning
# vm.overcommit_memory is deliberately unset. The value used to be 1 under a comment
# reading "disable overcommit", but 1 means *always* overcommit - 2 is the strict mode.
# The kernel heuristic (0) is the safer default.
# vm.max_map_count is deliberately unset: /usr/lib/sysctl.d/50-default.conf already
# sets 1048576, and the old 262144 would have lowered it.
# vm.swappiness is deliberately unset. 1 is spinning-disk advice that leaves zram idle,
# and 100 is only right on hosts that have zram - which this module does not set up.
vm.dirty_ratio = 30
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# Stop proactive kcompactd compaction storms. On large-vCPU VMware/KVM guests the
# background compaction daemon spins scanning tens of millions of pages while high-order
# memory is already free, soft-locking a CPU for 20-30s (kcompactd0 / mm_percpu_wq) --
# long enough for chrony to drop every NTP source and fire HostClockNotSynchronising.
# 0 disables *proactive* compaction only; direct (on-demand) compaction still runs when
# an allocation genuinely needs a contiguous block.
vm.compaction_proactiveness = 0

# ICMP hardening
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# TCP congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Network ingress performance
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 30000

# netdev_budget / netdev_budget_usecs: deliberately unset -- autotune.sh owns them and
# restores the kernel defaults. Neither belongs in a static file.
# netdev_budget was 30000 here and could never bind: net_rx_action() processes at most
# (NAPI instances on that CPU) * NAPI_POLL_WEIGHT(64) packets per round, so a typical
# host tops out at 128 -- 30000 would need 469 NAPI instances on one core, and even the
# kernel default of 300 needs 5.
# netdev_budget_usecs was 6000, and that one is real: it bounds how long a single NET_RX
# round holds a CPU with preemption disabled. The kernel default is 2 * USEC_PER_SEC / HZ,
# so on the HZ=1000 hosts this was a 3x longer window, bought nothing (fleet packet loss
# is zero), and is not portable -- since v6.14 the kernel refuses anything below its own
# default, which is 8000 at HZ=250. A value that depends on HZ cannot be a static line.

# General network performance
net.core.busy_poll = 0
net.core.busy_read = 0
net.ipv4.ipfrag_high_thresh = 8388608
net.ipv4.tcp_fastopen = 3

# TCP features
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_fack = 0

# Socket buffer tuning
net.core.wmem_max = 16777216
net.core.wmem_default = 1048576
net.core.rmem_max = 16777216
net.core.rmem_default = 1048576
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216
net.ipv4.tcp_mem = 65536 131072 16777216

# TCP settings
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_no_metrics_save = 0
net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.tcp_slow_start_after_idle = 0

# UDP tuning
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# Disable IPv6
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# Port range and latency
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_low_latency = 1

# Connection tracking
# nf_conntrack_max: owned solely by autotune.sh (RAM_GB * 65536) -- a static value here
# raced it (sysctl --system runs after autotune) and left each site a different ceiling

# Aggressive nf_conntrack cleanup
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close = 5
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 10
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 60
net.netfilter.nf_conntrack_tcp_timeout_unacknowledged = 300

# tcp_max_tw_buckets: owned solely by autotune.sh (RAM_GB * 65536)

# FIN and TIME_WAIT handling
net.ipv4.tcp_fin_timeout = 20
net.ipv4.tcp_tw_reuse = 0

# TCP keepalive tuning
net.ipv4.tcp_keepalive_time = 30
net.ipv4.tcp_keepalive_intvl = 5
net.ipv4.tcp_keepalive_probes = 3
