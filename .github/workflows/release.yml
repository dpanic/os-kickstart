name: Release

# Every push to main cuts a full release: bump the semver from conventional
# commits, then GoReleaser builds the archives and publishes the release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Compute the next version from conventional-commit history since the
      # latest tag: feat -> minor, "!"/BREAKING CHANGE -> major, else patch.
      # Inherits the tag's own "v" prefix. Pure git, no third-party action.
      - name: Compute next version
        id: tag
        run: |
          set -euo pipefail
          latest="$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$latest" ]; then
            prefix="v"; major=0; minor=0; patch=0; range=""
          else
            case "$latest" in v*) prefix="v"; core="${latest#v}";; *) prefix=""; core="$latest";; esac
            major="${core%%.*}"; rest="${core#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
            range="${latest}..HEAD"
          fi
          subjects="$(git log --format='%s' ${range:+$range})"
          bodies="$(git log --format='%B' ${range:+$range})"
          if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
             || printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
            major=$((major+1)); minor=0; patch=0
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]+\))?:'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          new_tag="${prefix}${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $new_tag"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # Tag HEAD locally + push, so GoReleaser reads the tag from local git
      # state on the current commit.
      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.new_tag }}"
          git push origin "${{ steps.tag.outputs.new_tag }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
