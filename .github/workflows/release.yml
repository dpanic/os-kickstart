name: Release

# Every push to main cuts a full release: bump the semver from conventional
# commits, then GoReleaser builds the archives and publishes the release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Compute the next version only (dry_run) from conventional-commit
      # prefixes; keeps the "v" prefix (e.g. v1.8.0 -> v1.8.1). We create the
      # tag ourselves on HEAD below so GoReleaser reads it from local git.
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # Tag HEAD locally + push, so GoReleaser sees the tag on the current
      # commit (an API-created tag is not visible to GoReleaser's git check).
      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.new_tag }}"
          git push origin "${{ steps.tag.outputs.new_tag }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin GoReleaser to the tag we just created (avoids git-describe ambiguity).
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
