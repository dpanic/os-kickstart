name: Release

# Every push to main cuts a full release: bump the semver from conventional
# commits, then GoReleaser builds the archives and publishes the release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bump from the latest tag using conventional-commit prefixes; keeps the
      # "v" prefix (e.g. v1.8.0 -> v1.8.1). Creates and pushes the tag.
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin GoReleaser to the tag we just created (avoids git-describe ambiguity).
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
